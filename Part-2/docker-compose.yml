services:
  # Go Backend
  backend:
    image: ericson3100/image-classifier-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: image-classifier-backend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Vue Frontend with Nginx
  frontend:
    image: ericson3100/image-classifier-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: image-classifier-frontend
    ports:
      - "3000:80"
    environment:
      - VUE_APP_API_URL=http://backend:8080
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  # Volume for model cache (if persistence is implemented)
  model-cache:
    driver: local
