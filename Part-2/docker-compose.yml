version: '3.8'

services:
  # Backend en Go
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: image-classifier-backend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Frontend en Vue con Nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: image-classifier-frontend
    ports:
      - "3000:80"
    environment:
      - VUE_APP_API_URL=http://localhost:8080
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  # Volumen para caché de modelos (si se implementa persistencia)
  model-cache:
    driver: local
