services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: image-classifier-backend-dev
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - GO_ENV=development
    volumes:
      - ./backend:/app
    command: go run .
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: image-classifier-frontend-dev
    ports:
      - "3000:3000"
    environment:
      - VUE_APP_API_URL=http://backend:8080
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
